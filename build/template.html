<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tabelão Yuny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4f0; --ink:#1a1612; --ink2:#4a433c; --ouro:#a07840; --ouro-t:#86622f;
  --painel:#efe9e1; --linha:#e2d9cc; --cartao:#fffdfa; --zebra:#f7f4f0; --ouro-claro:#eadcc6;
  --corpo:"DM Sans", system-ui, Arial, sans-serif; --titulo:Satoshi, "DM Sans", system-ui, Arial, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--corpo);font-size:15px;line-height:23px}
a{color:var(--ink)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}

/* tipografia de marca */
.sobre{margin:0;font-size:11px;line-height:16px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ouro-t)}
.regua{display:block;width:56px;height:1px;background:var(--ouro);margin:14px 0 0}
h1,h2,h3{font-family:var(--titulo)}
.titulo{margin:0;font-size:52px;line-height:56px;font-weight:300;letter-spacing:-.015em}
.titulo b{display:block;font-weight:700;color:var(--ouro-t)}

/* botões e etiquetas */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 26px;background:var(--ouro-t);color:var(--bg);text-decoration:none;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;border:0;border-radius:0;cursor:pointer}
.btn:hover{background:var(--ink)}
.btn.sec{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btn.sec:hover{background:var(--ink);color:var(--bg)}
.tag{display:inline-block;padding:5px 9px;font-size:10px;line-height:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.tag.sf{background:rgba(26,22,18,.55);color:#f7f4f0;box-shadow:inset 0 0 0 1px rgba(247,244,240,.55)}
.tag.cla{background:var(--painel);color:var(--ink)}
.st{display:inline-block;padding:4px 8px;font-size:10px;line-height:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.st-l{background:var(--ouro-t);color:var(--bg)}
.st-t,.st-n,.st-a{background:var(--ouro-claro);color:var(--ink)}
.st-o{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.st-c{background:var(--ink);color:var(--bg)}
.pill{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;background:transparent;border:1px solid var(--linha);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
.pill:hover{border-color:var(--ink)}
.pill.tour{background:var(--painel);border-color:var(--painel)}
.pill.off{opacity:.4;cursor:not-allowed}
.chip{min-height:40px;padding:0 4px;background:transparent;border:0;border-bottom:1px solid transparent;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);cursor:pointer}
.chip[aria-pressed="true"]{color:var(--ouro-t);border-bottom-color:var(--ouro)}
.campo{height:46px;padding:0 0 0 2px;border:0;border-bottom:1px solid var(--linha);background:transparent;font-size:15px;width:100%;border-radius:0}
.campo:focus{border-bottom-color:var(--ouro)}
label.l{display:block;font-size:10px;line-height:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ouro-t);margin-bottom:2px}

/* topo */
.topo{background:rgba(247,244,240,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:5}
.topo .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 28px;padding-top:14px;padding-bottom:14px}
.marca{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--ink)}
.marca img{height:28px;width:auto;display:block}
.marca span{font-size:10px;line-height:14px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ouro-t);border-left:1px solid var(--linha);padding-left:16px}
.menu{display:flex;flex-wrap:wrap;gap:0 22px}
.menu a{font-size:10.5px;line-height:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ouro-t);text-decoration:none;padding:15px 0;display:inline-block}
.menu a:hover{color:var(--ink)}
.menu-btn{display:none}

/* início */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:32px;padding:56px 0 8px}
.hero p.sub{margin:18px 0 0;font-size:16px;line-height:26px;font-weight:300;max-width:560px;color:var(--ink2)}
.kpis{display:flex;flex-wrap:wrap;gap:0;align-items:flex-end}
.kpi{padding:0 28px;border-left:1px solid var(--linha)}
.kpi:first-child{border-left:0;padding-left:0}
.kpi b{display:block;font-family:var(--titulo);font-size:40px;line-height:44px;font-weight:300}
.kpi small{display:block;margin-top:4px;font-size:10px;line-height:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ouro-t)}
.filtros{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px 28px;margin-top:40px;padding:0 0 4px;border-bottom:1px solid var(--linha)}
.filtros .busca{flex:0 1 340px;min-width:220px;padding-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:4px 24px}
.secao{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:52px 0 22px}
.secao > div{min-width:0}
.secao h2{margin:8px 0 0;font-size:27px;line-height:32px;font-weight:700}
.secao span{font-size:13px;color:var(--ink2);white-space:nowrap}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--cartao);transition:transform .2s, box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(26,22,18,.08)}
.card .foto{position:relative;aspect-ratio:4 / 3;overflow:hidden;background:var(--painel)}
.card .foto img.capa{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card .foto .sem{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--painel)}
.card .foto .sem img{max-width:48%;max-height:48%;object-fit:contain}
.card .foto .tags{position:absolute;left:14px;right:14px;top:14px;display:flex;flex-wrap:wrap;gap:6px}
.card .foto .grad{position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(to top, rgba(26,22,18,.72), rgba(26,22,18,0))}
.card .foto .loc{position:absolute;left:16px;right:16px;bottom:14px;color:#f7f4f0}
.card .foto:not(.tem) .loc{color:var(--ink)}
.card .foto:not(.tem) .tag.sf{background:var(--cartao);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.card .foto .sem{padding-bottom:56px}
.card .foto .loc small{display:block;font-size:10px;line-height:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.card .foto .loc strong{display:block;margin-top:4px;font-family:var(--titulo);font-size:22px;line-height:26px;font-weight:500}
.card .dados{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 18px 18px}
.card .dados b{display:block;font-family:var(--titulo);font-size:28px;line-height:30px;font-weight:500}
.card .dados small{display:block;margin-top:2px;font-size:10px;line-height:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ouro-t)}
.card .dados .preco{text-align:right}
.card .dados .preco strong{display:block;font-size:16px;line-height:22px;font-weight:600;font-variant-numeric:tabular-nums}
.vazio{margin:28px 0 0;font-weight:300}

/* empreendimento */
.capa-p{position:relative;min-height:360px;background:var(--ink);color:#f7f4f0;overflow:hidden}
.capa-p img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.capa-p .vel{position:absolute;inset:0;background:linear-gradient(90deg, rgba(26,22,18,.78) 0%, rgba(26,22,18,.35) 55%, rgba(26,22,18,.1) 100%)}
.capa-p .wrap{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:360px;padding-top:28px;padding-bottom:36px}
.capa-p .voltar{color:#f7f4f0;margin:0 0 auto}
.capa-p h1{margin:12px 0 0;font-size:46px;line-height:50px;font-weight:300;letter-spacing:-.01em}
.capa-p .end{margin:8px 0 0;font-size:11px;line-height:16px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.capa-p .end a{color:#f7f4f0;text-decoration:none;border-bottom:1px dotted rgba(247,244,240,.6)}
.capa-p .specs{display:inline-flex;flex-wrap:wrap;margin-top:18px;box-shadow:inset 0 0 0 1px rgba(247,244,240,.55)}
.capa-p .specs span{padding:10px 18px;font-family:var(--titulo);font-size:17px;line-height:22px;font-weight:300;border-left:1px solid rgba(247,244,240,.4)}
.capa-p .specs span:first-child{border-left:0}
.voltar{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
.subnav{position:sticky;top:57px;z-index:4;background:var(--bg);border-bottom:1px solid var(--linha)}
.subnav .wrap{display:flex;gap:4px 28px;overflow-x:auto}
.subnav a{display:inline-block;padding:14px 0;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--ink2);white-space:nowrap}
.subnav a:hover{color:var(--ouro-t)}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;margin-top:36px;background:var(--cartao);border:1px solid var(--linha)}
.resumo div{padding:20px 24px;border-left:1px solid var(--linha)}
.resumo div:first-child{border-left:0}
.resumo dt{font-size:10px;line-height:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ouro-t)}
.resumo dd{margin:8px 0 0;font-family:var(--titulo);font-size:30px;line-height:34px;font-weight:300;font-variant-numeric:tabular-nums}
.resumo dd.f{font-family:var(--corpo);font-size:14px;line-height:21px;font-weight:400}
.bloco-t{margin-top:52px}
.capa-p .dest{margin:10px 0 0;font-family:var(--titulo);font-size:18px;line-height:24px;font-weight:300}
.duas{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px 56px;margin-top:22px}
ul.lista{list-style:none;margin:12px 0 0;padding:0}
ul.lista li{position:relative;padding:9px 0 9px 22px;border-bottom:1px solid var(--linha);font-weight:300}
ul.lista li::before{content:"";position:absolute;left:0;top:19px;width:12px;height:1px;background:var(--ouro)}
dl.ficha{margin:12px 0 0}
dl.ficha div{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:16px;padding:9px 0;border-bottom:1px solid var(--linha)}
dl.ficha dt{font-size:10px;line-height:20px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ouro-t)}
dl.ficha dd{margin:0;font-weight:400}
.plantas{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:22px}
.plantas a{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--cartao);border:1px solid var(--linha)}
.plantas a:hover{border-color:var(--ouro)}
.plantas .pimg{display:block;aspect-ratio:4 / 3;background:#fff;overflow:hidden}
.plantas .pimg img{width:100%;height:100%;object-fit:contain;display:block}
.plantas .pimg.falhou{background:var(--painel)}
.plantas .pimg.falhou img{display:none}
.plantas .leg{padding:10px 12px 12px;font-size:13px;line-height:18px}

.bloco-t h2{margin:8px 0 0;font-size:27px;line-height:32px;font-weight:700}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:28px 48px;margin-top:20px}
.links .lst{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ferramentas{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-top:20px;padding-bottom:4px;border-bottom:1px solid var(--linha)}
.ferramentas .busca{flex:0 1 300px;min-width:200px;padding-bottom:10px}
.bloco{margin-top:24px;background:var(--cartao);border:1px solid var(--linha);overflow:hidden}
.bloco .t{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:18px 24px}
.bloco h3{margin:0;font-size:19px;line-height:25px;font-weight:500}
.bloco .t span{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ouro-t);white-space:nowrap}
.rolagem{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:14.5px;line-height:22px;font-variant-numeric:tabular-nums}
table.tb thead th{background:var(--painel);padding:11px 12px;font-size:10px;line-height:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);text-align:right;white-space:nowrap}
table.tb thead th:first-child{text-align:left;padding-left:24px}
table.tb thead th.esq{text-align:left}
table.tb thead th:last-child{padding-right:24px;color:var(--ink)}
table.tb td,table.tb tbody th{padding:12px;text-align:right;font-weight:400;white-space:nowrap;color:var(--ink2)}
table.tb tbody th{text-align:left;font-weight:600;color:var(--ink);padding-left:24px;position:sticky;left:0;background:inherit}
table.tb td.esq{text-align:left}
table.tb td.tot{font-weight:600;color:var(--ink);padding-right:24px}
table.tb tbody tr{background:var(--cartao)}
table.tb tbody tr:nth-child(even){background:var(--zebra)}
table.tb tbody tr:hover{background:var(--ouro-claro)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:16px}
.info p{margin:6px 0 0;font-weight:300}
.obs{margin:16px 0 0;font-size:13px;line-height:19px;font-weight:300;color:var(--ink2)}

/* disponibilidade */
.disp-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px 28px;margin-top:32px;padding-bottom:4px;border-bottom:1px solid var(--linha)}
.disp-f > div{padding-bottom:10px}
.disp-f select{height:46px;padding:0;border:0;border-bottom:1px solid var(--linha);background:transparent;font-size:15px;width:100%;border-radius:0}
.contagem{margin:18px 0 0;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ouro-t)}

footer.rod{margin-top:72px;border-top:1px solid var(--linha)}
footer.rod .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding-top:22px;padding-bottom:30px;font-size:12px;line-height:18px;color:var(--ink2)}

@media (max-width:720px){
  .wrap{padding:0 18px}
  .topo{position:static}
  .topo .wrap{position:relative}
  .menu-btn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;background:transparent;border:1px solid var(--linha);font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
  .menu{display:none;position:absolute;right:18px;top:64px;z-index:10;flex-direction:column;gap:0;min-width:230px;padding:6px 18px;background:var(--cartao);border:1px solid var(--linha)}
  .menu.aberto{display:flex}
  .menu a{padding:14px 0;border-bottom:1px solid var(--linha)}
  .menu a:last-child{border-bottom:0}
  .hero{padding-top:34px}
  .secao{flex-wrap:wrap;gap:6px}
  .secao h2{font-size:23px;line-height:28px}
  .titulo{font-size:36px;line-height:40px}
  .kpi{padding:0 18px}
  .kpi b{font-size:30px;line-height:34px}
  .capa-p,.capa-p .wrap{min-height:300px}
  .capa-p h1{font-size:32px;line-height:36px}
  .capa-p .specs span{padding:8px 12px;font-size:14px}
  .subnav{top:0}
  .resumo div{border-left:0;border-top:1px solid var(--linha)}
  .resumo div:first-child{border-top:0}
  .bloco .t{padding:16px}
  table.tb thead{display:none}
  table.tb,table.tb tbody{display:block}
  table.tb tbody tr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 16px}
  table.tb tbody th{padding:0;font-size:16px;position:static}
  table.tb td{padding:0;text-align:left;white-space:normal}
  table.tb td[data-l]::before{content:attr(data-l) " ";font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ouro-t)}
  table.tb td.st-cel{grid-column:2;grid-row:1;justify-self:end}
  table.tb td.tot{grid-column:1 / -1;font-size:17px;padding:4px 0 0}
  table.tb td.parc{grid-column:1 / -1;font-size:13px}
  table.tb td.area,table.tb td.m2{font-size:13px}
}
</style>
</head>
<body>
<header class="topo">
  <div class="wrap">
    <a class="marca" href="#/"><img src="__LOGO__" alt="Yuny"><span>Tabelão</span></a>
    <button type="button" class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="menu">Menu</button>
    <nav class="menu" aria-label="Atalhos" id="menu"></nav>
  </div>
</header>
<div id="app" tabindex="-1"></div>
<footer class="rod"><div class="wrap"><span id="rod-esq"></span><span>Valores e disponibilidade sujeitos a confirmação no momento da proposta.</span></div></footer>

<script id="dados" type="application/json">__DATA__</script>
<script>
(function(){
'use strict';
var D = JSON.parse(document.getElementById('dados').textContent);
var app = document.getElementById('app');
var HID = {v:1,p:1,i:1};
var ST = {l:'Livre',t:'Em tratativa',o:'Reservada',c:'Contrato rodado',a:'Enviada p/ aprovação',n:'Em negociação'};
var ST_TXT = {'LIVRE':'l','EM TRATATIVA':'t','RESERVADA':'o','CONTRATO RODADO':'c','ENVIADA P/ APROVAÇÃO':'a','EM NEGOCIAÇÃO':'n'};
var FASE_TAG = {'Pronto':'Pronto para morar','Em obras':'Em obras','Lançamento':'Lançamento','Esgotado':'100% vendido'};
var estado = {filtro:'Todos', busca:'', so:false, dBuscaU:'', dEmp:'', dTipo:'', dSt:'', dBusca:''};
var SETA = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg>';
var VOLTA = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg>';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function brl(v){return 'R$ '+Math.round(v).toLocaleString('pt-BR');}
function m2(v){return v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' m²';}
function m2c(v){return Math.round(v).toLocaleString('pt-BR')+' m²';}
function norm(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}

// ---------- preparo ----------
D.projetos.forEach(function(p){
  var f = p.fase.toLowerCase();
  p.faseCurta = /esgot/.test(f)?'Esgotado': /obra/.test(f)?'Em obras': /lan/.test(f)?'Lançamento':'Pronto';
  p.faseDet = (p.fase.split('·')[1]||'').trim();
  if(p.faseCurta==='Esgotado') p.faseDet='';
  var partes = p.endereco.split('–');
  p.bairro = (/\d/.test(partes[0]) && partes[1] ? partes[1] : partes[0]).split(',')[0].trim();
  var rows = [], livres = [];
  if(p.tabela){ p.tabela.grupos.forEach(function(g){ g.rows.forEach(function(r){ if(!HID[r[1]]){rows.push(r); if(r[1]==='l') livres.push(r);} }); }); }
  p.livres = livres.length; p.visiveis = rows.length;
  p.aPartir = livres.length ? Math.min.apply(null, livres.map(function(r){return r[4][r[4].length-1];})) : null;
  if(livres.length){ var as = livres.map(function(r){return r[2];}); p.areaMin = Math.min.apply(null,as); p.areaMax = Math.max.apply(null,as); }
  p.fluxo = [];
  if(p.tabela && livres.length && p.tabela.payLabels.length>1){
    var r = livres[0], tot = r[4][r[4].length-1];
    p.tabela.payLabels.slice(0,-1).forEach(function(lab,i){
      var m = lab.match(/^(\d+)x\s+(.*)$/); var n = m?+m[1]:1; var nome = m?m[2]:lab;
      p.fluxo.push({n:n, nome:nome, pct: Math.round(1000*n*r[4][i]/tot)/10});
    });
  }
});
var vendendo = D.projetos.filter(function(p){return p.livres>0;});
var totLivres = vendendo.reduce(function(s,p){return s+p.livres;},0);

// menu
var menu = document.getElementById('menu');
menu.innerHTML = D.menu.map(function(it){
  var ext = /^https?:/.test(it.href);
  return '<a href="'+esc(it.href)+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+esc(it.label)+'</a>';
}).join('');
var mb = document.getElementById('menu-btn');
mb.addEventListener('click',function(){var a=menu.classList.toggle('aberto');mb.setAttribute('aria-expanded',a);});
menu.addEventListener('click',function(e){if(e.target.tagName==='A'){menu.classList.remove('aberto');mb.setAttribute('aria-expanded','false');}});
document.getElementById('rod-esq').textContent = 'Tabelão Yuny · Tabelas '+D.mes.toLowerCase()+' · status VIMOB de '+D.status;

function fotoHTML(p){
  var sem = '<div class="sem"><img src="'+p.logo+'" alt=""></div>';
  if(!p.foto) return sem;
  return sem+'<img class="capa" src="'+esc(p.foto)+'" alt="" loading="lazy" onerror="this.parentNode.classList.remove(\'tem\');this.remove()"><div class="grad"></div>';

// ---------- telas ----------
function cardHTML(p){
  var dados = p.livres>0
    ? '<div><b>'+p.livres.toLocaleString('pt-BR')+'</b><small>'+(p.livres===1?'unidade livre':'unidades livres')+'</small></div><div class="preco"><small>a partir de</small><strong>'+brl(p.aPartir)+'</strong></div>'
    : '<div><small style="margin:0">'+(p.faseCurta==='Esgotado'?'100% vendido':'Sem unidades livres')+'</small></div>';
  var tags = '<span class="tag sf">'+esc(FASE_TAG[p.faseCurta])+'</span>'+(p.linha==='ape'?'<span class="tag sf">APÊ 55</span>':'');
  return '<a class="card" href="#/p/'+p.id+'"><div class="foto'+(p.foto?' tem':'')+'">'+fotoHTML(p)+'<div class="tags">'+tags+'</div>'+
    '<div class="loc"><small>'+esc(p.bairro)+' · São Paulo</small><strong>'+esc(p.nome)+'</strong></div></div><div class="dados">'+dados+'</div></a>';
}
function inicio(){
  document.title = 'Tabelão Yuny';
  var chips = ['Todos','Pronto','Em obras','Lançamento','APÊ 55'];
  app.innerHTML =
    '<div class="wrap"><section class="hero"><div style="flex:1 1 440px;min-width:0"><p class="sobre">Portal de vendas · '+esc(D.mes)+'</p><span class="regua"></span>'+
    '<h1 class="titulo" style="margin-top:22px">Tabelas e<b>disponibilidade.</b></h1>'+
    '<p class="sub">Preços de '+esc(D.mes.toLowerCase())+', atualizados em '+esc(D.atualizado)+'. Status das unidades do VIMOB de '+esc(D.status)+'.</p></div>'+
    '<div style="display:flex;flex-direction:column;align-items:flex-start;gap:26px"><div class="kpis"><div class="kpi"><b>'+totLivres.toLocaleString('pt-BR')+'</b><small>Unidades livres</small></div><div class="kpi"><b>'+vendendo.length+'</b><small>Empreendimentos</small></div></div>'+
    '<a class="btn" href="#/disponibilidade">Disponibilidade completa '+SETA+'</a></div></section>'+
    '<section class="filtros" aria-label="Filtros"><div class="busca"><label class="l" for="busca">Buscar</label><input id="busca" class="campo" type="search" placeholder="Empreendimento ou bairro" value="'+esc(estado.busca)+'"></div>'+
    '<div class="chips" role="group" aria-label="Fase">'+chips.map(function(c){return '<button type="button" class="chip" data-c="'+c+'" aria-pressed="'+(estado.filtro===c)+'">'+(c==='Pronto'?'Pronto para morar':c)+'</button>';}).join('')+'</div></section>'+
    '<div id="listas"></div></div>';
  var desenhar = function(){
    var q = norm(estado.busca.trim());
    var passa = function(p){
      if(estado.filtro==='APÊ 55' && p.linha!=='ape') return false;
      if(['Pronto','Em obras','Lançamento'].indexOf(estado.filtro)>=0 && p.faseCurta!==estado.filtro) return false;
      if(q && norm(p.nome+' '+p.bairro+' '+p.endereco).indexOf(q)<0) return false;
      return true;
    };
    var y = D.projetos.filter(function(p){return p.linha==='yuny'&&passa(p);});
    var a = D.projetos.filter(function(p){return p.linha==='ape'&&passa(p);});
    var sec = function(sob,t,l){ if(!l.length) return ''; return '<div class="secao"><div><p class="sobre">'+sob+'</p><h2>'+t+'</h2></div><span>'+l.length+(l.length===1?' empreendimento':' empreendimentos')+'</span></div><div class="grade">'+l.map(cardHTML).join('')+'</div>'; };
    document.getElementById('listas').innerHTML = sec('Portfólio Yuny','Nossos empreendimentos',y)+sec('Marca APÊ 55','Linha APÊ 55',a)+(y.length+a.length?'':'<p class="vazio">Nenhum empreendimento com esse filtro.</p>');
  };
  desenhar();
  document.getElementById('busca').addEventListener('input',function(e){estado.busca=e.target.value;desenhar();});
  [].forEach.call(app.querySelectorAll('.chip'),function(b){b.addEventListener('click',function(){estado.filtro=b.dataset.c;[].forEach.call(app.querySelectorAll('.chip'),function(x){x.setAttribute('aria-pressed',x===b);});desenhar();});});
}

function linhasTabela(p,g,q,so){
  var labs = p.tabela.payLabels;
  var rows = g.rows.filter(function(r){ if(HID[r[1]]) return false; if(so && r[1]!=='l') return false; if(q && norm(r[0]).indexOf(q)<0) return false; return true; });
  if(!rows.length) return null;
  var parcLabs = labs.slice(0,-1);
  var head = '<tr><th scope="col">Unidade</th><th scope="col" class="esq">Status</th><th scope="col">Área privativa</th><th scope="col">R$/m²</th>'+
    parcLabs.map(function(l){return '<th scope="col">'+esc(l.replace(/^1x\s+/,''))+'</th>';}).join('')+'<th scope="col">Total</th></tr>';
  var body = rows.map(function(r){
    var v = r[4], parc = parcLabs.map(function(l,i){return '<td class="parc" data-l="'+esc(l.replace(/^1x\s+/,''))+'">'+brl(v[i])+'</td>';}).join('');
    return '<tr><th scope="row">'+esc(r[0])+'</th><td class="esq st-cel"><span class="st st-'+r[1]+'">'+esc(ST[r[1]]||r[1])+'</span></td>'+
      '<td class="area" data-l="Área">'+m2(r[2])+'</td><td class="m2" data-l="R$/m²">'+brl(r[3])+'</td>'+parc+'<td class="tot" data-l="Total">'+brl(v[v.length-1])+'</td></tr>';
  }).join('');
  return {n:rows.length, livres:rows.filter(function(r){return r[1]==='l';}).length, html:'<div class="rolagem"><table class="tb"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'};
}
function projeto(id){
  var p = D.projetos.filter(function(x){return x.id===id;})[0];
  if(!p){ location.hash='#/'; return; }
  document.title = p.nome+' · Tabelão Yuny';
  estado.dBuscaU=''; estado.so=false;
  var NOMES = {'Treinar':'Treinamento','Pronto':'Pasta completa'};
  var temPl0 = p.fx && p.fx.plantas && p.fx.plantas.length;
  var mat = p.botoes.filter(function(b){return b.label!=='Tabela' && !(temPl0 && !b.href && /Plantas|Implanta/.test(b.label));}).map(function(b){
    var lab = NOMES[b.label]||b.label;
    return b.href ? '<a class="pill" href="'+esc(b.href)+'" target="_blank" rel="noopener">'+esc(lab)+'</a>' : '<span class="pill off" aria-disabled="true" title="Sem material disponível">'+esc(lab)+'</span>';
  }).join('');
  var extra = (p.portal?'<a class="pill" href="'+esc(p.portal)+'" target="_blank" rel="noopener">Portal do corretor</a>':'')+(p.site?'<a class="pill" href="'+esc(p.site)+'" target="_blank" rel="noopener">Página no site</a>':'');
  var tours = p.tours.map(function(t){return '<a class="pill tour" href="'+esc(t.href)+'" target="_blank" rel="noopener">'+esc(t.label)+'</a>';}).join('');
  var fluxo = p.fluxo.length ? p.fluxo.map(function(f){return (f.n>1?f.n+'x ':'')+esc(f.nome)+' · '+String(f.pct).replace('.',',')+'%';}).join('<br>') : (p.tabela?'Sob consulta':'—');
  var endereco = p.mapa ? '<a href="'+esc(p.mapa)+'" target="_blank" rel="noopener">'+esc(p.endereco)+'</a>' : esc(p.endereco);
  var specs = [];
  if(p.livres){ specs.push(p.areaMin===p.areaMax? m2c(p.areaMin) : m2c(p.areaMin)+' a '+m2c(p.areaMax)); specs.push(p.livres.toLocaleString('pt-BR')+(p.livres===1?' livre':' livres')); specs.push('a partir de '+brl(p.aPartir)); }
  var capaImg = p.foto ? '<img class="bg" src="'+esc(p.foto)+'" alt="" onerror="this.remove()">' : '';
  var resumo = p.livres>0
    ? '<div><dt>Unidades livres</dt><dd>'+p.livres.toLocaleString('pt-BR')+'</dd></div><div><dt>A partir de</dt><dd>'+brl(p.aPartir)+'</dd></div><div><dt>Fluxo de '+esc(D.mes.split(' ')[0].toLowerCase())+'</dt><dd class="f">'+fluxo+'</dd></div>'
    : '<div><dt>Situação</dt><dd>'+(p.faseCurta==='Esgotado'?'100% vendido':'Sem unidades livres')+'</dd></div>';
  var temTab = p.tabela && p.visiveis;
  var fx = p.fx || {};
  var temProd = (fx.tipologias&&fx.tipologias.length)||(fx.ficha&&fx.ficha.length);
  var temPlantas = fx.plantas && fx.plantas.length;
  var temDif = (fx.lazer&&fx.lazer.length)||(fx.diferenciais&&fx.diferenciais.length);
  var navs = [];
  if(temTab) navs.push(['tabela','Tabela']); if(temProd) navs.push(['produto','Produto']); if(temPlantas) navs.push(['plantas','Plantas']);
  if(temDif) navs.push(['diferenciais','Diferenciais']); navs.push(['materiais','Materiais']); if(tours) navs.push(['tours','Tours']);
  if(p.info.length||p.obs) navs.push(['obs','Condomínio']);
  app.innerHTML =
    '<section class="capa-p">'+capaImg+'<div class="vel"></div><div class="wrap"><a class="voltar" href="#/">'+VOLTA+' Empreendimentos</a>'+
      '<div><span class="tag sf">'+esc(FASE_TAG[p.faseCurta])+(p.faseDet?' · '+esc(p.faseDet):'')+'</span><h1>'+esc(p.nome)+'</h1><p class="end">'+endereco+'</p>'+
      (fx.destaque?'<p class="dest">'+esc(fx.destaque)+'</p>':'')+
      (specs.length?'<div class="specs">'+specs.map(function(s){return '<span>'+s+'</span>';}).join('')+'</div>':'')+'</div></div></section>'+
    '<nav class="subnav" aria-label="Seções"><div class="wrap">'+navs.map(function(n){return '<a href="#'+n[0]+'" data-ancora>'+n[1]+'</a>';}).join('')+'</div></nav>'+
    '<div class="wrap"><dl class="resumo">'+resumo+'</dl>'+
    (temTab ? '<section class="bloco-t" id="tabela"><p class="sobre">Tabela de '+esc(D.mes.toLowerCase())+'</p><h2>Disponibilidade e preços</h2>'+
      '<div class="ferramentas"><div class="busca"><label class="l" for="bu">Buscar unidade</label><input id="bu" class="campo" type="search" inputmode="numeric" placeholder="Ex.: 1204"></div><button type="button" class="chip" id="so" aria-pressed="false">Só livres</button></div><div id="tabelas"></div></section>' : '')+
    (temProd ? '<section class="bloco-t" id="produto"><p class="sobre">O empreendimento</p><h2>Produto e ficha técnica</h2><div class="duas">'+
      (fx.tipologias&&fx.tipologias.length?'<div><p class="sobre">Tipologias</p><ul class="lista">'+fx.tipologias.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul></div>':'')+
      (fx.ficha&&fx.ficha.length?'<div><p class="sobre">Ficha técnica</p><dl class="ficha">'+fx.ficha.map(function(r){return '<div><dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd></div>';}).join('')+'</dl></div>':'')+
      '</div>'+(fx.stand?'<p class="obs">Stand de vendas: '+esc(fx.stand)+'</p>':'')+'</section>' : '')+
    (temPlantas ? '<section class="bloco-t" id="plantas"><p class="sobre">Plantas</p><h2>Plantas e implantação</h2><div class="plantas">'+fx.plantas.map(function(pl){return '<a href="'+esc(pl[0])+'" target="_blank" rel="noopener"><span class="pimg"><img src="'+esc(pl[0])+'" alt="'+esc(pl[1])+'" loading="lazy" onerror="this.parentNode.classList.add(\'falhou\')"></span><span class="leg">'+esc(pl[1])+'</span></a>';}).join('')+'</div><p class="obs">Imagens ilustrativas do site yuny.com.br. Clique para ampliar.</p></section>' : '')+
    (temDif ? '<section class="bloco-t" id="diferenciais"><p class="sobre">Argumentos de venda</p><h2>Lazer e diferenciais</h2><div class="duas">'+
      (fx.lazer&&fx.lazer.length?'<div><p class="sobre">Lazer</p><ul class="lista">'+fx.lazer.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul></div>':'')+
      (fx.diferenciais&&fx.diferenciais.length?'<div><p class="sobre">Diferenciais</p><ul class="lista">'+fx.diferenciais.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul></div>':'')+
      '</div></section>' : '')+
    '<section class="bloco-t" id="materiais"><p class="sobre">Materiais</p><h2>Material de venda</h2><div class="links"><div class="lst">'+mat+extra+'</div></div></section>'+
    (tours ? '<section class="bloco-t" id="tours"><p class="sobre">Experiência</p><h2>Tours e maquetes</h2><div class="lst" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:16px">'+tours+'</div></section>' : '')+
    ((p.info.length||p.obs) ? '<section class="bloco-t" id="obs"><p class="sobre">Informações</p><h2>Condomínio e observações</h2>'+
      (p.info.length?'<div class="info">'+p.info.map(function(t){var k=t.split(':');return k.length>1?'<div><p class="sobre">'+esc(k[0])+'</p><p>'+esc(k.slice(1).join(':').trim())+'</p></div>':'<div><p class="sobre">Informação</p><p>'+esc(t)+'</p></div>';}).join('')+'</div>':'')+
      (p.obs?'<p class="obs">'+esc(p.obs)+'</p>':'')+'</section>' : '')+
    '</div>';
  [].forEach.call(app.querySelectorAll('[data-ancora]'),function(a){a.addEventListener('click',function(e){e.preventDefault();var t=document.getElementById(a.getAttribute('href').slice(1));if(t)window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-110,behavior:'smooth'});});});
  if(!temTab) return;
  var desenhar = function(){
    var q = norm(estado.dBuscaU.trim()), html = '';
    p.tabela.grupos.forEach(function(g){
      var t = linhasTabela(p,g,q,estado.so);
      if(!t) return;
      html += '<section class="bloco"><div class="t"><h3>'+esc(g.cat||'Unidades')+'</h3><span>'+t.livres+(t.livres===1?' livre':' livres')+' de '+t.n+'</span></div>'+t.html+'</section>';
    });
    document.getElementById('tabelas').innerHTML = html || '<p class="vazio">Nenhuma unidade com esse filtro.</p>';
  };
  desenhar();
  document.getElementById('bu').addEventListener('input',function(e){estado.dBuscaU=e.target.value;desenhar();});
  var so = document.getElementById('so');
  so.addEventListener('click',function(){estado.so=!estado.so; so.setAttribute('aria-pressed',estado.so); desenhar();});
}

function tipologia(t){ t=(t||'').toUpperCase(); if(/LOJA|COMERCIAL/.test(t)) return 'Loja'; if(/N[ÃA]O RES|STUDIO|SERVI|VAGA/.test(t)) return 'Não residencial / studio'; return 'Residencial'; }
function disponibilidade(){
  document.title = 'Disponibilidade completa · Tabelão Yuny';
  var emps = D.widget.map(function(e){return e.emp;});
  var opt = function(v,l,sel){return '<option value="'+esc(v)+'"'+(sel?' selected':'')+'>'+esc(l)+'</option>';};
  app.innerHTML =
    '<div class="wrap"><a class="voltar" href="#/" style="margin-top:18px">'+VOLTA+' Início</a>'+
    '<section class="hero" style="padding-top:16px"><div><p class="sobre">'+esc(D.mes)+'</p><span class="regua"></span><h1 class="titulo" style="margin-top:22px">Disponibilidade<b>completa.</b></h1><p class="sub">Todas as unidades em oferta, de todos os empreendimentos. Valores do VIMOB de '+esc(D.status)+'.</p></div></section>'+
    '<section class="disp-f" aria-label="Filtros">'+
      '<div><label class="l" for="fe">Empreendimento</label><select id="fe">'+opt('','Todos',!estado.dEmp)+emps.map(function(e){return opt(e,e,estado.dEmp===e);}).join('')+'</select></div>'+
      '<div><label class="l" for="ft">Tipologia</label><select id="ft">'+opt('','Todas')+['Residencial','Não residencial / studio','Loja'].map(function(t){return opt(t,t,estado.dTipo===t);}).join('')+'</select></div>'+
      '<div><label class="l" for="fs">Status</label><select id="fs">'+opt('','Todos')+['LIVRE','EM TRATATIVA','RESERVADA','CONTRATO RODADO'].map(function(s){return opt(s,ST[ST_TXT[s]],estado.dSt===s);}).join('')+'</select></div>'+
      '<div><label class="l" for="fb">Buscar unidade</label><input id="fb" class="campo" type="search" placeholder="Ex.: 1204" value="'+esc(estado.dBusca)+'"></div>'+
    '</section><p class="contagem" id="cont"></p><section class="bloco" style="margin-top:14px"><div class="rolagem" id="dt"></div></section></div>';
  var desenhar = function(){
    var q = norm(estado.dBusca.trim()), linhas = [], livres = 0;
    D.widget.forEach(function(e){
      if(estado.dEmp && e.emp!==estado.dEmp) return;
      e.torres.forEach(function(t){
        if(estado.dTipo && tipologia(t.torre)!==estado.dTipo) return;
        t.unidades.forEach(function(u){
          if(estado.dSt && u.st!==estado.dSt) return;
          if(q && norm(u.u).indexOf(q)<0) return;
          if(u.st==='LIVRE') livres++;
          linhas.push('<tr><th scope="row">'+esc(u.u)+'</th><td class="esq">'+esc(e.emp)+'<br><span style="font-size:12px">'+esc(t.torre)+'</span></td><td class="esq st-cel"><span class="st st-'+(ST_TXT[u.st]||'o')+'">'+esc(ST[ST_TXT[u.st]]||u.st)+'</span></td><td class="area" data-l="Área">'+m2(u.metr)+'</td><td class="m2" data-l="R$/m²">'+brl(u.m2)+'</td><td class="tot" data-l="Total">'+brl(u.total)+'</td></tr>');
        });
      });
    });
    document.getElementById('cont').textContent = linhas.length.toLocaleString('pt-BR')+' unidades · '+livres.toLocaleString('pt-BR')+' livres';
    document.getElementById('dt').innerHTML = linhas.length ? '<table class="tb"><thead><tr><th scope="col">Unidade</th><th scope="col" class="esq">Empreendimento</th><th scope="col" class="esq">Status</th><th scope="col">Área privativa</th><th scope="col">R$/m²</th><th scope="col">Total</th></tr></thead><tbody>'+linhas.join('')+'</tbody></table>' : '<p class="vazio" style="padding:0 24px 20px">Nenhuma unidade com esses filtros.</p>';
  };
  desenhar();
  [['fe','dEmp','change'],['ft','dTipo','change'],['fs','dSt','change'],['fb','dBusca','input']].forEach(function(c){document.getElementById(c[0]).addEventListener(c[2],function(e){estado[c[1]]=e.target.value;desenhar();});});
}

function rota(){
  var h = location.hash || '#/';
  var m = h.match(/^#\/p\/([\w]+)/);
  if(m) projeto(m[1]); else if(h.indexOf('#/disponibilidade')===0) disponibilidade(); else inicio();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', rota);
rota();
})();
</script>
