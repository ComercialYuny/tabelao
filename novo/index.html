<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tabelão Yuny</title>
<style>
:root{
  --carvao:#141414; --offwhite:#e4e3de; --azul:#00b0b9; --bege:#c7b299;
  --fundo:#f4f3ef; --cartao:#ffffff; --linha:#dcdad3; --zebra:#f4f3ef;
  --fonte:"BW Fusiona", Arial, Helvetica, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fundo);color:var(--carvao);font-family:var(--fonte);font-size:15px;line-height:22px}
a{color:var(--carvao)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--carvao);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
.selo{display:inline-block;padding:4px 10px;font-size:11px;line-height:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;background:var(--offwhite);white-space:nowrap}
.selo.lanc{background:var(--azul)} .selo.obras{background:var(--bege)} .selo.esgot{background:var(--carvao);color:var(--offwhite)}
.st{display:inline-block;padding:3px 9px;font-size:11px;line-height:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;white-space:nowrap}
.st-l{background:var(--azul)} .st-t,.st-n,.st-a{background:var(--bege)} .st-o{background:var(--cartao);box-shadow:inset 0 0 0 1px var(--carvao)} .st-c{background:var(--carvao);color:var(--offwhite)}
.rot{margin:0;font-size:12px;line-height:16px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.cartao{background:var(--cartao);border:1px solid var(--linha);border-radius:8px}
.pill{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;background:var(--cartao);border:1px solid var(--linha);border-radius:999px;font-size:13px;font-weight:500;text-decoration:none;color:var(--carvao)}
.pill.tour{background:var(--offwhite);border-color:var(--offwhite)}
.pill.off{opacity:.45;cursor:not-allowed}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 22px;background:var(--azul);color:var(--carvao);text-decoration:none;font-size:15px;font-weight:800;border-radius:999px;border:0;cursor:pointer}
.chip{min-height:44px;padding:0 18px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.04em;cursor:pointer;background:var(--cartao);border:1px solid var(--linha)}
.chip[aria-pressed="true"]{background:var(--carvao);color:#fff;border-color:var(--carvao)}
.campo{height:46px;padding:0 16px;border:1px solid var(--linha);border-radius:999px;background:var(--fundo);font-size:15px;width:100%}
label.l{display:block;font-size:13px;line-height:18px;font-weight:500;margin-bottom:6px}

/* topo */
.topo{background:var(--cartao);border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:5}
.topo .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 28px;padding-top:12px;padding-bottom:12px}
.marca{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--carvao)}
.marca img{height:32px;width:auto;display:block}
.marca span{font-size:12px;line-height:16px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-left:1px solid var(--linha);padding-left:16px}
.menu{display:flex;flex-wrap:wrap;gap:0 20px;font-size:13px;line-height:18px;font-weight:500}
.menu a{text-decoration:none;padding:13px 0;display:inline-block}
.menu a:hover{text-decoration:underline}
.menu-btn{display:none}
table.tb tbody th{position:sticky;left:0;background:inherit}
table.tb tbody tr{background:var(--cartao)}

/* inicio */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:28px;padding:44px 0 0}
.hero h1{margin:0;font-size:48px;line-height:52px;font-weight:800;letter-spacing:-.02em}
.hero p.sub{margin:12px 0 0;font-size:16px;line-height:26px;font-weight:300;max-width:600px}
.kpis{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.kpi{padding:14px 20px;min-width:140px}
.kpi b{display:block;font-size:30px;line-height:34px;font-weight:800;letter-spacing:-.015em}
.kpi small{font-size:13px;line-height:18px;font-weight:500}
.filtros{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 20px;margin-top:28px;padding:16px 20px}
.filtros .busca{flex:0 1 360px;min-width:220px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.secao{display:flex;align-items:center;gap:16px;margin:40px 0 16px}
.secao h2{margin:0;font-size:14px;line-height:20px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.secao .fio{flex:1;height:1px;background:var(--linha)}
.secao span{font-size:13px;font-weight:500;white-space:nowrap}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{display:flex;flex-direction:column;min-height:250px;padding:20px;text-decoration:none;color:var(--carvao);transition:border-color .15s}
.card:hover{border-color:var(--carvao)}
.card .topo-card{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card .logo{height:52px;display:flex;align-items:center}
.card .logo img{max-height:52px;max-width:140px;width:auto;height:auto;object-fit:contain;display:block}
.card h3{margin:18px 0 0;font-size:19px;line-height:25px;font-weight:800;letter-spacing:-.01em}
.card .bairro{margin:2px 0 0;font-size:14px;line-height:20px;font-weight:300}
.card .rodape{margin-top:auto;padding:14px 16px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;background:var(--fundo);border-radius:6px}
.card .rodape b{display:block;font-size:26px;line-height:28px;font-weight:800}
.card .rodape small{font-size:12px;line-height:16px;font-weight:500}
.card .rodape .preco{text-align:right}
.card .rodape .preco small{font-weight:300;display:block}
.card .rodape .preco strong{font-size:15px;line-height:22px;font-weight:800;font-variant-numeric:tabular-nums}
.vazio{margin:24px 0 0;font-weight:300}

/* empreendimento */
.voltar{display:inline-flex;align-items:center;gap:8px;min-height:44px;margin-top:16px;font-size:13px;font-weight:500;text-decoration:none}
.cab{margin-top:6px;padding:26px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px}
.cab .id{display:flex;align-items:center;gap:22px;flex:1 1 480px;min-width:0}
.cab .id img{width:96px;height:96px;object-fit:contain;border-radius:6px;display:block;flex-shrink:0;background:var(--fundo)}
.cab h1{margin:10px 0 0;font-size:34px;line-height:38px;font-weight:800;letter-spacing:-.015em}
.cab .end{margin:6px 0 0;font-size:15px;line-height:22px;font-weight:300}
.cab .end a{text-decoration-style:dotted}
.cab dl{display:flex;flex-wrap:wrap;margin:0}
.cab dl div{padding:4px 22px;border-left:1px solid var(--linha)}
.cab dl div:first-child{border-left:0;padding-left:0}
.cab dt{font-size:13px;line-height:18px;font-weight:500}
.cab dd{margin:4px 0 0;font-size:30px;line-height:34px;font-weight:800;font-variant-numeric:tabular-nums}
.cab dd.m{font-size:22px}
.cab dd.f{font-size:14px;line-height:20px;font-weight:500}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px 40px;padding:22px 4px 4px}
.links .lst{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ferramentas{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-top:28px}
.ferramentas .busca{flex:0 1 300px;min-width:200px}
.bloco{margin-top:20px;overflow:hidden}
.bloco .t{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:18px 24px}
.bloco h2{margin:0;font-size:21px;line-height:27px;font-weight:800;letter-spacing:-.01em}
.bloco .t span{font-size:13px;font-weight:500;white-space:nowrap}
.rolagem{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:15px;line-height:22px;font-variant-numeric:tabular-nums}
table.tb thead th{background:var(--offwhite);padding:11px 12px;font-size:12px;line-height:16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;text-align:right;white-space:nowrap}
table.tb thead th:first-child{text-align:left;padding-left:24px}
table.tb thead th.esq{text-align:left}
table.tb thead th:last-child{padding-right:24px}
table.tb td,table.tb tbody th{padding:12px;text-align:right;font-weight:300;white-space:nowrap}
table.tb tbody th{text-align:left;font-weight:800;padding-left:24px}
table.tb td.esq{text-align:left}
table.tb td.tot{font-weight:800;padding-right:24px}
table.tb tbody tr:nth-child(even){background:var(--zebra)}
table.tb tbody tr:hover{background:var(--offwhite)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:20px;padding:20px 24px}
.info p{margin:6px 0 0;font-weight:300}
.obs{margin:14px 4px 0;font-size:13px;line-height:18px;font-weight:300}

/* disponibilidade */
.disp-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:24px;padding:16px 20px}
.disp-f select{height:46px;padding:0 14px;border:1px solid var(--linha);border-radius:999px;background:var(--fundo);font-size:15px;width:100%}
.contagem{margin:16px 4px 0;font-size:13px;font-weight:500}

footer.rod{margin-top:56px;background:var(--cartao);border-top:1px solid var(--linha)}
footer.rod .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding-top:20px;padding-bottom:28px;font-size:13px;line-height:18px;font-weight:500}
footer.rod span+span{font-weight:300}

@media (max-width:720px){
  .wrap{padding:0 16px}
  .topo{position:static}
  .topo .wrap{position:relative}
  .menu-btn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;background:var(--cartao);border:1px solid var(--linha);border-radius:999px;font-size:13px;font-weight:800;cursor:pointer}
  .menu{display:none;position:absolute;right:16px;top:64px;z-index:10;flex-direction:column;gap:0;min-width:220px;padding:8px 16px;background:var(--cartao);border:1px solid var(--linha);border-radius:8px}
  .menu.aberto{display:flex}
  .menu a{padding:12px 0;border-bottom:1px solid var(--linha)}
  .menu a:last-child{border-bottom:0}
  .cab dl{display:grid;grid-template-columns:1fr 1fr;width:100%;gap:12px 0}
  .cab dl div{padding:0 0 0 14px}
  .cab dl div:first-child{padding-left:0}
  .cab dl div:nth-child(3){grid-column:1 / -1;border-left:0;padding:12px 0 0;border-top:1px solid var(--linha)}
  table.tb tbody th{position:static}
  .hero{padding-top:28px}
  .hero h1{font-size:32px;line-height:36px}
  .menu{gap:0 16px}
  .cab{padding:18px}
  .cab .id{gap:14px}
  .cab .id img{width:64px;height:64px}
  .cab h1{font-size:24px;line-height:28px}
  .cab dl div{padding:4px 14px}
  .cab dd{font-size:22px;line-height:28px}
  .cab dd.m{font-size:18px}
  .bloco .t{padding:16px}
  table.tb thead{display:none}
  table.tb,table.tb tbody{display:block}
  table.tb tbody tr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 16px}
  table.tb tbody th{padding:0;font-size:16px}
  table.tb td{padding:0;text-align:left;white-space:normal}
  table.tb td[data-l]::before{content:attr(data-l) " ";font-weight:500;font-size:12px}
  table.tb td.st-cel{grid-column:2;grid-row:1;justify-self:end}
  table.tb td.tot{grid-column:1 / -1;font-size:17px;padding:4px 0 0}
  table.tb td.tot::before{font-size:12px}
  table.tb td.parc{grid-column:1 / -1;font-size:13px}
  table.tb td.area,table.tb td.m2{font-size:13px}
}
</style>
</head>

<script>
(function(){
'use strict';
var D = JSON.parse(document.getElementById('dados').textContent);
var app = document.getElementById('app');
var HID = {v:1,p:1,i:1};
var ST = {l:'Livre',t:'Em tratativa',o:'Reservada',c:'Contrato rodado',a:'Enviada p/ aprovação',n:'Em negociação'};
var ST_TXT = {'LIVRE':'l','EM TRATATIVA':'t','RESERVADA':'o','CONTRATO RODADO':'c','ENVIADA P/ APROVAÇÃO':'a','EM NEGOCIAÇÃO':'n'};
var estado = {filtro:'Todos', busca:'', so:'', dEmp:'', dTipo:'', dSt:'', dBusca:''};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function brl(v){return 'R$ '+Math.round(v).toLocaleString('pt-BR');}
function m2(v){return v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' m²';}
function norm(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}

// ---------- preparo ----------
D.projetos.forEach(function(p){
  var f = p.fase.toLowerCase();
  p.faseCurta = /esgot/.test(f)?'Esgotado': /obra/.test(f)?'Em obras': /lan/.test(f)?'Lançamento':'Pronto';
  p.faseDet = (p.fase.split('·')[1]||'').trim();
  if(p.faseCurta==='Esgotado') p.faseDet='';
  p.seloCls = {'Esgotado':'esgot','Em obras':'obras','Lançamento':'lanc'}[p.faseCurta]||'';
  var partes = p.endereco.split('–');
  p.bairro = (/\d/.test(partes[0]) && partes[1] ? partes[1] : partes[0]).split(',')[0].trim();
  if(p.id==='natury'){p.nome='Natury Jardim Botânico'; p.bairro='Jardim Botânico';}
  var rows = [], livres = [];
  if(p.tabela){ p.tabela.grupos.forEach(function(g){ g.rows.forEach(function(r){ if(!HID[r[1]]){rows.push(r); if(r[1]==='l') livres.push(r);} }); }); }
  p.livres = livres.length; p.visiveis = rows.length;
  p.aPartir = livres.length ? Math.min.apply(null, livres.map(function(r){return r[4][r[4].length-1];})) : null;
  // fluxo resumido a partir de uma unidade livre
  p.fluxo = [];
  if(p.tabela && livres.length && p.tabela.payLabels.length>1){
    var r = livres[0], tot = r[4][r[4].length-1];
    p.tabela.payLabels.slice(0,-1).forEach(function(lab,i){
      var m = lab.match(/^(\d+)x\s+(.*)$/); var n = m?+m[1]:1; var nome = m?m[2]:lab;
      p.fluxo.push({n:n, nome:nome, pct: Math.round(1000*n*r[4][i]/tot)/10});
    });
  }
});
var vendendo = D.projetos.filter(function(p){return p.livres>0;});
var totLivres = vendendo.reduce(function(s,p){return s+p.livres;},0);

// menu
var menu = document.getElementById('menu');
var itens = [
  ['Disponibilidade completa','#/disponibilidade'],
  ['Ficha cadastral',null,'Ficha'], ['Sigavi',null,'SIGAVI'], ['Portfólio',null,'Portif'],
  ['Materiais',null,'Drive'], ['Yuny Academy',null,'ACADEMY'], ['Lojas','lojas.html'], ['Material admin.',null,'Admin'], ['TouchApp',null,'TouchApp']
];
menu.innerHTML = itens.map(function(it){
  var href = it[1];
  if(!href){ var n = D.nav.filter(function(x){return x.label.indexOf(it[2])>=0;})[0]; href = n?n.href:'#'; }
  var ext = /^https?:/.test(href);
  return '<a href="'+esc(href)+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+esc(it[0])+'</a>';
}).join('');
var mb=document.getElementById('menu-btn');
mb.addEventListener('click',function(){var a=menu.classList.toggle('aberto');mb.setAttribute('aria-expanded',a);});
menu.addEventListener('click',function(e){if(e.target.tagName==='A'){menu.classList.remove('aberto');mb.setAttribute('aria-expanded','false');}});
document.getElementById('rod-esq').textContent = 'Tabelão Yuny · Tabelas '+D.mes+' · status VIMOB de '+D.status;

// ---------- telas ----------
function cardHTML(p){
  var rod = p.livres>0
    ? '<div><b>'+p.livres+'</b><small>'+(p.livres===1?'unidade livre':'unidades livres')+'</small></div><div class="preco"><small>a partir de</small><strong>'+brl(p.aPartir)+'</strong></div>'
    : '<div><small style="font-size:15px">'+(p.faseCurta==='Esgotado'?'100% vendido':'Sem unidades livres')+'</small></div>';
  return '<a class="card cartao" href="#/p/'+p.id+'"><div class="topo-card"><div class="logo"><img src="'+p.logo+'" alt=""></div><span class="selo '+p.seloCls+'">'+esc(p.faseCurta)+'</span></div>'+
    '<h3>'+esc(p.nome)+'</h3><p class="bairro">'+esc(p.bairro)+'</p><div class="rodape">'+rod+'</div></a>';
}
function inicio(){
  document.title = 'Tabelão Yuny';
  var chips = ['Todos','Pronto','Em obras','Lançamento','APÊ 55'];
  app.innerHTML =
    '<section class="hero"><div style="flex:1 1 420px;min-width:0"><p class="rot" style="margin-bottom:10px">'+esc(D.mes)+'</p><h1>Tabelas e disponibilidade</h1>'+
    '<p class="sub">Preços de '+esc(D.mes.toLowerCase())+', atualizados em '+esc(D.atualizado)+'. Status das unidades do VIMOB de '+esc(D.status)+'.</p></div>'+
    '<div class="kpis"><div class="kpi cartao"><b>'+totLivres.toLocaleString('pt-BR')+'</b><small>unidades livres</small></div><div class="kpi cartao"><b>'+vendendo.length+'</b><small>empreendimentos à venda</small></div>'+
    '<a class="btn" href="#/disponibilidade" style="align-self:center">Disponibilidade completa <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="#141414" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section>'+
    '<section class="filtros cartao" aria-label="Filtros"><div class="busca"><label class="l" for="busca">Buscar empreendimento ou bairro</label><input id="busca" class="campo" type="search" placeholder="Ex.: Itaim, ZIP" value="'+esc(estado.busca)+'"></div>'+
    '<div class="chips" role="group" aria-label="Fase">'+chips.map(function(c){return '<button type="button" class="chip" data-c="'+c+'" aria-pressed="'+(estado.filtro===c)+'">'+(c==='Pronto'?'Prontos':c)+'</button>';}).join('')+'</div></section>'+
    '<div id="listas"></div>';
  var desenhar = function(){
    var q = norm(estado.busca.trim());
    var passa = function(p){
      if(estado.filtro==='APÊ 55' && p.linha!=='ape') return false;
      if(['Pronto','Em obras','Lançamento'].indexOf(estado.filtro)>=0 && p.faseCurta!==estado.filtro) return false;
      if(q && norm(p.nome+' '+p.bairro+' '+p.endereco).indexOf(q)<0) return false;
      return true;
    };
    var y = D.projetos.filter(function(p){return p.linha==='yuny'&&passa(p);});
    var a = D.projetos.filter(function(p){return p.linha==='ape'&&passa(p);});
    var sec = function(t,l){ if(!l.length) return ''; return '<div class="secao"><h2>'+t+'</h2><div class="fio"></div><span>'+l.length+(l.length===1?' empreendimento':' empreendimentos')+'</span></div><div class="grade">'+l.map(cardHTML).join('')+'</div>'; };
    document.getElementById('listas').innerHTML = sec('Empreendimentos Yuny',y)+sec('Linha APÊ 55',a)+(y.length+a.length?'':'<p class="vazio">Nenhum empreendimento com esse filtro.</p>');
  };
  desenhar();
  document.getElementById('busca').addEventListener('input',function(e){estado.busca=e.target.value;desenhar();});
  [].forEach.call(app.querySelectorAll('.chip'),function(b){b.addEventListener('click',function(){estado.filtro=b.dataset.c;[].forEach.call(app.querySelectorAll('.chip'),function(x){x.setAttribute('aria-pressed',x===b);});desenhar();});});
}

function linhasTabela(p,g,q,so){
  var labs = p.tabela.payLabels;
  var rows = g.rows.filter(function(r){ if(HID[r[1]]) return false; if(so && r[1]!=='l') return false; if(q && norm(r[0]).indexOf(q)<0) return false; return true; });
  if(!rows.length) return null;
  var parcLabs = labs.slice(0,-1);
  var head = '<tr><th scope="col">Unidade</th><th scope="col" class="esq">Status</th><th scope="col">Área privativa</th><th scope="col">R$/m²</th>'+
    parcLabs.map(function(l){return '<th scope="col">'+esc(l.replace(/^1x\s+/,''))+'</th>';}).join('')+'<th scope="col">Total</th></tr>';
  var body = rows.map(function(r){
    var v = r[4], parc = parcLabs.map(function(l,i){return '<td class="parc" data-l="'+esc(l.replace(/^1x\s+/,''))+'">'+brl(v[i])+'</td>';}).join('');
    return '<tr><th scope="row">'+esc(r[0])+'</th><td class="esq st-cel"><span class="st st-'+r[1]+'">'+esc(ST[r[1]]||r[1])+'</span></td>'+
      '<td class="area" data-l="Área">'+m2(r[2])+'</td><td class="m2" data-l="R$/m²">'+brl(r[3])+'</td>'+parc+'<td class="tot" data-l="Total">'+brl(v[v.length-1])+'</td></tr>';
  }).join('');
  return {n:rows.length, livres:rows.filter(function(r){return r[1]==='l';}).length, html:'<div class="rolagem"><table class="tb"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'};
}
function projeto(id){
  var p = D.projetos.filter(function(x){return x.id===id;})[0];
  if(!p){ location.hash='#/'; return; }
  document.title = p.nome+' · Tabelão Yuny';
  estado.dBuscaU=''; estado.so='';
  var mat = p.botoes.filter(function(b){return b.label!=='Tabela';}).map(function(b){
    var lab = {'Treinar':'Treinamento','Pronto':'Pasta completa','Apresentação':'Apresentação'}[b.label]||b.label;
    return b.href ? '<a class="pill" href="'+esc(b.href)+'" target="_blank" rel="noopener">'+esc(lab)+'</a>' : '<span class="pill off" aria-disabled="true" title="Sem material disponível">'+esc(lab)+'</span>';
  }).join('');
  var tours = p.tours.map(function(t){return '<a class="pill tour" href="'+esc(t.href)+'" target="_blank" rel="noopener">'+esc(t.label)+'</a>';}).join('');
  var fluxo = p.fluxo.length ? p.fluxo.map(function(f){return (f.n>1?f.n+'x ':'')+esc(f.nome)+' · '+String(f.pct).replace('.',',')+'%';}).join('<br>') : (p.tabela?'Sob consulta':'—');
  var endereco = p.mapa ? '<a href="'+esc(p.mapa)+'" target="_blank" rel="noopener">'+esc(p.endereco)+'</a>' : esc(p.endereco);
  var kpis = p.livres>0
    ? '<div><dt>Livres</dt><dd>'+p.livres+'</dd></div><div><dt>A partir de</dt><dd class="m">'+brl(p.aPartir)+'</dd></div><div><dt>Fluxo de '+esc(D.mes.split(' ')[0].toLowerCase())+'</dt><dd class="f">'+fluxo+'</dd></div>'
    : '<div><dt>Situação</dt><dd class="m">'+(p.faseCurta==='Esgotado'?'100% vendido':'Sem unidades livres')+'</dd></div>';
  app.innerHTML =
    '<a class="voltar" href="#/"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4" stroke="#141414" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Todos os empreendimentos</a>'+
    '<section class="cab cartao"><div class="id"><img src="'+p.logo+'" alt="Logo '+esc(p.nome)+'"><div style="min-width:0"><span class="selo '+p.seloCls+'">'+esc(p.faseCurta)+(p.faseDet?' · '+esc(p.faseDet):'')+'</span><h1>'+esc(p.nome)+'</h1><p class="end">'+endereco+'</p></div></div><dl>'+kpis+'</dl></section>'+
    '<section class="links" aria-label="Materiais e tours"><div><p class="rot">Material de venda</p><div class="lst">'+mat+'</div></div>'+(tours?'<div><p class="rot">Tours</p><div class="lst">'+tours+'</div></div>':'')+'</section>'+
    (p.tabela && p.visiveis ? '<div class="ferramentas"><div class="busca"><label class="l" for="bu">Buscar unidade</label><input id="bu" class="campo" type="search" inputmode="numeric" placeholder="Ex.: 1204"></div><button type="button" class="chip" id="so" aria-pressed="false">Só livres</button></div><div id="tabelas"></div>' : '')+
    (p.info.length ? '<section class="info cartao">'+p.info.map(function(t){var k=t.split(':');return k.length>1?'<div><p class="rot">'+esc(k[0])+'</p><p>'+esc(k.slice(1).join(':').trim())+'</p></div>':'<div><p class="rot">Informação</p><p>'+esc(t)+'</p></div>';}).join('')+'</section>' : '')+
    (p.obs ? '<p class="obs">'+esc(p.obs)+'</p>' : '');
  if(!(p.tabela && p.visiveis)) return;
  var desenhar = function(){
    var q = norm(estado.dBuscaU.trim()), html = '';
    p.tabela.grupos.forEach(function(g){
      var t = linhasTabela(p,g,q,estado.so);
      if(!t) return;
      html += '<section class="bloco cartao"><div class="t"><h2>'+esc(g.cat||'Unidades')+'</h2><span>'+t.livres+(t.livres===1?' livre':' livres')+' de '+t.n+'</span></div>'+t.html+'</section>';
    });
    document.getElementById('tabelas').innerHTML = html || '<p class="vazio">Nenhuma unidade com esse filtro.</p>';
  };
  desenhar();
  document.getElementById('bu').addEventListener('input',function(e){estado.dBuscaU=e.target.value;desenhar();});
  var so = document.getElementById('so');
  so.addEventListener('click',function(){estado.so=!estado.so; so.setAttribute('aria-pressed',!!estado.so); desenhar();});
}

function tipologia(t){ t=(t||'').toUpperCase(); if(/LOJA|COMERCIAL/.test(t)) return 'Loja'; if(/N[ÃA]O RES|STUDIO|SERVI|VAGA/.test(t)) return 'Não residencial / studio'; return 'Residencial'; }
function disponibilidade(){
  document.title = 'Disponibilidade completa · Tabelão Yuny';
  var emps = D.widget.map(function(e){return e.emp;});
  var opt = function(v,l,sel){return '<option value="'+esc(v)+'"'+(sel?' selected':'')+'>'+esc(l)+'</option>';};
  app.innerHTML =
    '<a class="voltar" href="#/"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4" stroke="#141414" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Início</a>'+
    '<section class="hero" style="padding-top:12px"><div><p class="rot" style="margin-bottom:10px">'+esc(D.mes)+'</p><h1>Disponibilidade completa</h1><p class="sub">Todas as unidades em oferta, de todos os empreendimentos. Valores do VIMOB de '+esc(D.status)+'.</p></div></section>'+
    '<section class="disp-f cartao" aria-label="Filtros">'+
      '<div><label class="l" for="fe">Empreendimento</label><select id="fe">'+opt('','Todos',!estado.dEmp)+emps.map(function(e){return opt(e,e,estado.dEmp===e);}).join('')+'</select></div>'+
      '<div><label class="l" for="ft">Tipologia</label><select id="ft">'+opt('','Todas')+['Residencial','Não residencial / studio','Loja'].map(function(t){return opt(t,t,estado.dTipo===t);}).join('')+'</select></div>'+
      '<div><label class="l" for="fs">Status</label><select id="fs">'+opt('','Todos')+['LIVRE','EM TRATATIVA','RESERVADA','CONTRATO RODADO'].map(function(s){return opt(s,ST[ST_TXT[s]],estado.dSt===s);}).join('')+'</select></div>'+
      '<div><label class="l" for="fb">Buscar unidade</label><input id="fb" class="campo" type="search" placeholder="Ex.: 1204" value="'+esc(estado.dBusca)+'"></div>'+
    '</section><p class="contagem" id="cont"></p><section class="bloco cartao" style="margin-top:12px"><div class="rolagem" id="dt"></div></section>';
  var desenhar = function(){
    var q = norm(estado.dBusca.trim()), linhas = [], livres = 0;
    D.widget.forEach(function(e){
      if(estado.dEmp && e.emp!==estado.dEmp) return;
      e.torres.forEach(function(t){
        if(estado.dTipo && tipologia(t.torre)!==estado.dTipo) return;
        t.unidades.forEach(function(u){
          if(estado.dSt && u.st!==estado.dSt) return;
          if(q && norm(u.u).indexOf(q)<0) return;
          if(u.st==='LIVRE') livres++;
          linhas.push('<tr><th scope="row">'+esc(u.u)+'</th><td class="esq" data-l="">'+esc(e.emp)+'<br><span style="font-size:12px">'+esc(t.torre)+'</span></td><td class="esq st-cel"><span class="st st-'+(ST_TXT[u.st]||'o')+'">'+esc(ST[ST_TXT[u.st]]||u.st)+'</span></td><td class="area" data-l="Área">'+m2(u.metr)+'</td><td class="m2" data-l="R$/m²">'+brl(u.m2)+'</td><td class="tot" data-l="Total">'+brl(u.total)+'</td></tr>');
        });
      });
    });
    document.getElementById('cont').textContent = linhas.length.toLocaleString('pt-BR')+' unidades · '+livres.toLocaleString('pt-BR')+' livres';
    document.getElementById('dt').innerHTML = linhas.length ? '<table class="tb"><thead><tr><th scope="col">Unidade</th><th scope="col" class="esq">Empreendimento</th><th scope="col" class="esq">Status</th><th scope="col">Área privativa</th><th scope="col">R$/m²</th><th scope="col">Total</th></tr></thead><tbody>'+linhas.join('')+'</tbody></table>' : '<p class="vazio" style="padding:0 24px 20px">Nenhuma unidade com esses filtros.</p>';
  };
  desenhar();
  [['fe','dEmp','change'],['ft','dTipo','change'],['fs','dSt','change'],['fb','dBusca','input']].forEach(function(c){document.getElementById(c[0]).addEventListener(c[2],function(e){estado[c[1]]=e.target.value;desenhar();});});
}

function rota(){
  var h = location.hash || '#/';
  var m = h.match(/^#\/p\/([\w]+)/);
  if(m) projeto(m[1]); else if(h.indexOf('#/disponibilidade')===0) disponibilidade(); else inicio();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', rota);
rota();
})();
</script>
</body>
</html>
